# pytest settings for the Voice Interpreter.
# Run all tests from the project folder with:
#     .venv\Scripts\python -m pytest
[pytest]
# Look for tests only in the tests\ folder (not in archive\, learning\ etc.)
testpaths = tests
# Put the project folder on the import path, so tests can "import interpreter"
pythonpath = .
# -ra: list skipped/failed tests at the end; -q: shorter output
addopts = -ra -q
